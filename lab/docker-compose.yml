services:
  internet:
    build: ./internet
    container_name: lab_internet
    hostname: internet
    networks:
      wan:
        ipv4_address: 172.20.0.10

  nat-router:
    build: ./nat-router
    container_name: lab_nat_router
    hostname: nat-router
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      wan:
        ipv4_address: 172.20.0.254
      lan:
        ipv4_address: 172.20.1.254

  dhcp-server:
    build: ./dhcp-server
    container_name: lab_dhcp_server
    hostname: dhcp-server
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - NET_BIND_SERVICE
    networks:
      lan:
        ipv4_address: 172.20.1.2

  client:
    build: ./client
    container_name: lab_client
    hostname: client
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      lan:
        ipv4_address: 172.20.1.50
    stdin_open: true
    tty: true
    # Passerelle par défaut = le routeur du lab (et non le bridge Docker)
    command: bash -c "ip route replace default via 172.20.1.254 && exec sleep infinity"

  # ⚠️ Exercice 5 (bonus) uniquement : faux serveur DHCP.
  # Ne démarre PAS avec un simple "docker compose up -d".
  # Pour l'activer : docker compose --profile bonus up -d rogue-dhcp
  rogue-dhcp:
    build: ./rogue
    container_name: lab_rogue_dhcp
    hostname: rogue-dhcp
    profiles: ["bonus"]
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - NET_BIND_SERVICE
    networks:
      lan:
        ipv4_address: 172.20.1.99

networks:
  wan:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
    ipam:
      config:
        - subnet: 172.20.0.0/24
  lan:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
    ipam:
      config:
        - subnet: 172.20.1.0/24
